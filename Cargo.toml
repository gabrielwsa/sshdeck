[package]
name = "sshdeck"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
dirs = "7.0.0"
portable-pty = "0.9.0"
rand = "0.8"
ratatui = "0.30.2"
rust-i18n = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tui-term = "0.3.4"
vt100 = "0.16"
zeroize = "1.9.1"

# dependências otimizadas mesmo no `cargo run` (o emulador vt100 em debug é lento)
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
