[package]
name = "sshdeck-gui"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "sshdeck-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sshdeck-core = { path = "../../core" }
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
zeroize = "1.9.1"
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-tokio = "0.10"
ironrdp-graphics = "0.9"
ironrdp-pdu = "0.9"
ironrdp-core = "0.2"
ironrdp-dvc = "0.8"
ironrdp-displaycontrol = "0.8"
ironrdp-svc = "0.8"
ironrdp-tls = { version = "0.2.2", features = ["rustls-ring"] }
sha2 = "0.10"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util"] }
# atualizações pelos releases do GitHub (TLS pelo mesmo rustls/ring do RDP)
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
